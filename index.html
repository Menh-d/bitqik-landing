<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bitqik ບິດຄິກ — Official Channels &amp; Platform</title>
  <meta name="description" content="bitqik ບິດຄິກ — Laos' #1 Licensed &amp; Regulated Digital Asset Exchange Platform." />
  <meta name="theme-color" content="#F26522" />

  <!-- OpenGraph / Social Meta -->
  <meta property="og:title" content="bitqik ບິດຄິກ — Official Channels" />
  <meta property="og:description" content="ແພລດຟອມຊື້-ຂາຍ ສິນຊັບດິຈິທັອນອັນດັບ 1 ໃນລາວ. ຕິດຕາມຊ່ອງທາງທາງການຂອງ bitqik" />
  <meta property="og:image" content="assets/bitqik_logo_official.png" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Swiss Minimalist Architectural Grid Stylesheet -->
  <link rel="stylesheet" href="css/glass.css" />
</head>
<body>

  <!-- Main Rounded Architectural Canvas Card -->
  <div class="canvas-card">

    <!-- Signature Intersecting Rounded Hairline Grid Lines -->
    <div class="arch-line-upper" aria-hidden="true"></div>
    <div class="arch-line-lower" aria-hidden="true"></div>

    <!-- Top-Left: Official bitqik Logo -->
    <header class="top-left-brand">
      <a href="https://bitqik.com" target="_blank" rel="noopener noreferrer" class="brand-logo-link" title="bitqik Official Website">
        <div class="logo-mark-wrap">
          <div class="logo-official-badge">
            <img src="assets/bitqik_logo_official.png" alt="bitqik ບິດຄິກ Official Logo" />
          </div>
        </div>
      </a>
    </header>

    <!-- Top-Right: Theme Switcher, Language Toggle & "Main Menu ╰────" -->
    <div class="top-right-menu">
      <div class="theme-switcher" title="Switch Canvas Color">
        <button type="button" class="theme-dot orange" data-theme-choice="orange" aria-label="Bitqik Orange Theme"></button>
        <button type="button" class="theme-dot blue" data-theme-choice="blue" aria-label="Asklepios Blue Theme"></button>
        <button type="button" class="theme-dot navy" data-theme-choice="navy" aria-label="Bitqik Navy Theme"></button>
      </div>

      <button type="button" class="lang-toggle-btn" id="lang-btn">
        <span id="lang-btn-text">🇱🇦 ລາວ</span>
      </button>

      <div class="menu-header-indicator">
        <span data-i18n="menuHeader">Main Menu</span>
        <span class="menu-l-line" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Left Quadrant (Above Curve): Secondary Links -->
    <nav class="left-quadrant-info" aria-label="Secondary Information">
      <a href="https://bitqik.com" target="_blank" rel="noopener noreferrer" class="secondary-info-link" data-i18n="infoLicense">Licensed by BOL</a>
      <a href="https://support.bitqik.com" target="_blank" rel="noopener noreferrer" class="secondary-info-link" data-i18n="infoSupport">Support Center</a>
      <a href="https://bitqik.com/privacy" target="_blank" rel="noopener noreferrer" class="secondary-info-link" data-i18n="infoPrivacy">Privacy Policy</a>
      <a href="https://bitqik.com/terms" target="_blank" rel="noopener noreferrer" class="secondary-info-link" data-i18n="infoTerms">Terms of Use</a>
    </nav>

    <!-- Left Quadrant (Below Curve): Vertical Social Icon Column -->
    <div class="social-vertical-stack" aria-label="Social Media Icons">
      <!-- Facebook -->
      <a href="https://www.facebook.com/bitqik" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/>
        </svg>
      </a>

      <!-- YouTube -->
      <a href="https://www.youtube.com/@bitqikofficial" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.58 7.19C21.35 6.33 20.67 5.65 19.81 5.42C18.25 5 12 5 12 5C12 5 5.75 5 4.19 5.42C3.33 5.65 2.65 6.33 2.42 7.19C2 8.75 2 12 2 12C2 12 2 15.25 2.42 16.81C2.65 17.67 3.33 18.35 4.19 18.58C5.75 19 12 19 12 19C12 19 18.25 19 19.81 18.58C20.67 18.35 21.35 17.67 21.58 16.81C22 15.25 22 12 22 12C22 12 22 8.75 21.58 7.19ZM10 15V9L15.2 12L10 15Z"/>
        </svg>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@bitqikofficial" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.59 6.69A4.83 4.83 0 0 1 15.82 2.44H12.56V15.67A2.89 2.89 0 0 1 9.67 18.17A2.89 2.89 0 0 1 6.78 15.28A2.89 2.89 0 0 1 9.67 12.39C9.97 12.39 10.25 12.44 10.53 12.53V9.19C10.25 9.15 9.96 9.13 9.67 9.13A6.15 6.15 0 0 0 3.52 15.28A6.15 6.15 0 0 0 9.67 21.43A6.15 6.15 0 0 0 15.82 15.28V8.94A8.05 8.05 0 0 0 20.48 10.42V7.16C20.17 7.16 19.87 6.97 19.59 6.69Z"/>
        </svg>
      </a>

      <!-- Official Website -->
      <a href="https://bitqik.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Official Website">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM11 19.93C7.05 19.44 4 16.08 4 12C4 11.38 4.08 10.79 4.21 10.21L9 15V16C9 17.1 9.9 18 11 18V19.93ZM17.9 17.39C17.64 16.58 16.9 16 16 16H15V13C15 12.45 14.55 12 14 12H8V10H10C10.55 10 11 9.55 11 9V7H13C14.1 7 15 6.1 15 5V4.59C17.93 5.78 20 8.65 20 12C20 14.08 19.2 15.97 17.9 17.39Z"/>
        </svg>
      </a>
    </div>

    <!-- Center-Right: Massive Editorial Navigation Stage + Interactive 3D Phone Mockup -->
    <main class="main-editorial-stage">
      <ul class="editorial-nav-list" id="editorial-nav-list">
        <!-- Populated by js/app.js -->
      </ul>

      <!-- Interactive 3D Phone Mockup Stage -->
      <div class="phone-3d-stage" id="phoneStage">
        <a href="https://bitqik.com/download" target="_blank" rel="noopener noreferrer" class="phone-3d-wrapper" id="phoneWrapper" title="Download bitqik Mobile App">
          <div class="phone-3d-device" id="phoneDevice">
            <div class="phone-screen-sheen" id="phoneSheen"></div>
            <img src="assets/app_mockup_3d.png" alt="bitqik Mobile App 3D Mockup" class="phone-mockup-img" />
            <div class="phone-float-tag">
              <span class="phone-pulse-dot"></span>
              <span data-i18n="appPreviewLabel">bitqik Mobile App</span>
            </div>
          </div>
        </a>
      </div>
    </main>

    <!-- Bottom-Right: Copyright -->
    <footer class="bottom-right-copyright">
      <p class="copyright-text" data-i18n="copyright">
        COPYRIGHT 2026 © BITQIK SOLE CO., LTD. ALL RIGHTS RESERVED.
      </p>
    </footer>

  </div>

  <!-- Application Script -->
  <script src="js/app.js"></script>

</html>
